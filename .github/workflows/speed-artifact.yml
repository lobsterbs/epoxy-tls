name: speed-artifact

on:
  push:
    branches: [speed-build]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build both variants and prove the speed features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch pinned rustls and apply patches (fuzz=0)
        run: sh tools/apply-rustls.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install wasm-bindgen
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.100"

      - name: setup binaryen (wasm-opt, wasm-dis)
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      - name: build the size variant (must stay mvp + size-optimized)
        working-directory: client
        run: |
          RELEASE=1 bash build.sh
          cp -r pkg pkg-size

      - name: reset for the speed variant
        working-directory: client
        run: rm -r pkg

      - name: build the speed variant (default std, bulk-memory, sign-ext, SIMD128)
        working-directory: client
        run: RELEASE=1 SPEED=1 bash build.sh

      - name: glue carries the identity seam in both variants
        run: |
          grep -q "identity" client/pkg/epoxy.js
          grep -q "identity" client/pkg-size/epoxy.js

      - name: size variant stays simd-free (bulk-memory is present upstream, informational)
        run: |
          wasm-dis client/pkg-size/epoxy.wasm -o "$RUNNER_TEMP/size.dis"
          hits_simd=$(grep -cE 'v128|i8x16|i16x8|i32x4|i64x2|f32x4|f64x2' "$RUNNER_TEMP/size.dis")
          bulk_lines=$(grep -cE 'memory\.(fill|copy|init)' "$RUNNER_TEMP/size.dis")
          echo "size variant simd instruction lines: $hits_simd (bulk-memory instruction lines present: $bulk_lines, informational)"
          test "$hits_simd" -eq 0

      - name: speed variant actually uses SIMD and bulk-memory
        run: |
          wasm-dis client/pkg/epoxy.wasm -o "$RUNNER_TEMP/speed.dis"
          hits_simd=$(grep -cE 'v128|i8x16|i16x8|i32x4|i64x2|f32x4|f64x2' "$RUNNER_TEMP/speed.dis")
          hits_bulk=$(grep -cE 'memory\.(fill|copy|init)' "$RUNNER_TEMP/speed.dis")
          echo "simd instruction lines: $hits_simd"
          echo "bulk-memory instruction lines: $hits_bulk"
          test "$hits_simd" -gt 0
          test "$hits_bulk" -gt 0

      - name: both modules validate in a js engine
        run: |
          node -e "
            const fs = require('fs');
            for (const p of ['client/pkg/epoxy.wasm', 'client/pkg-size/epoxy.wasm']) {
              const bytes = new Uint8Array(fs.readFileSync(p));
              if (!WebAssembly.validate(bytes)) { throw new Error(p + ' does not validate'); }
              console.log(p + ' validates (' + bytes.length + ' bytes)');
            }
          "

      - name: digests and sizes
        working-directory: client
        run: |
          sha256sum pkg/epoxy.js pkg/epoxy.wasm pkg-size/epoxy.js pkg-size/epoxy.wasm
          ls -l pkg pkg-size

      - name: upload both variants as workflow artifacts (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: epoxy-speed-variant
          path: |
            client/pkg/
            client/pkg-size/
