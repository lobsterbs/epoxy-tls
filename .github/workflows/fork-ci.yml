name: fork-ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustls-patches:
    name: vendored rustls applies byte-strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch pinned rustls and apply patches (fuzz=0)
        run: sh tools/apply-rustls.sh

      - name: patched rustls native check (ring arm)
        run: cargo check -p rustls --no-default-features --features std,ring,tls12,brotli,zlib
        working-directory: vendor/rustls

      - name: patches byte-match lyrebird main
        run: |
          set -eu
          for p in patches/*.patch; do
            name=$(basename "$p")
            curl -fsSL "https://raw.githubusercontent.com/lobsterbs/lyrebird/main/patches/$name" -o "/tmp/$name"
            diff -q "$p" "/tmp/$name" || {
              echo "::error::$name drifts from lobsterbs/lyrebird main"
              exit 1
            }
          done
          echo "all patches byte-match lyrebird main"

  epoxy-hello:
    name: epoxy-hello tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch pinned rustls and apply patches (fuzz=0)
        run: sh tools/apply-rustls.sh

      - name: unit tests
        run: cargo test -p epoxy-hello

  epoxy-client-wasm:
    name: epoxy-client wasm32 check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "--features full"
          - "--no-default-features"
    steps:
      - uses: actions/checkout@v4

      - name: fetch pinned rustls and apply patches (fuzz=0)
        run: sh tools/apply-rustls.sh

      - name: wasm32 check (${{ matrix.features }})
        run: RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo check -p epoxy-client --target wasm32-unknown-unknown ${{ matrix.features }}

  wire-parity-bin:
    name: wire-parity build + live ja4 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch pinned rustls and apply patches (fuzz=0)
        run: sh tools/apply-rustls.sh

      - name: build (aws-lc arm)
        run: cargo build -p wire-parity

      - name: usage smoke (bad args exit nonzero)
        run: |
          if target/debug/wire-parity; then
            echo "::error::wire-parity accepted empty args"
            exit 1
          fi
          echo "usage gating ok"

      # Per-push live identity gate (lyrebird #6): the pinned ja4s are the
      # lyrebird gap-ledger profile fingerprints. Any push that changes the
      # wire fails here, on every push, not just nightly. If tls.peet.ws is
      # down these steps fail loudly on every push; that is the owner's
      # chosen policy. The nightly live-parity workflow stays the deep gate.
      - name: brave handshake must match the pinned ja4
        run: |
          target/debug/wire-parity brave tls.peet.ws 443 /api/all \
            --expect-ja4 t13d914h2_f91f431d341e_9682305a41b3 > /tmp/brave.json
          grep -o '"ja4": *"t13d[^"]*' /tmp/brave.json || true

      - name: firefox handshake must match the pinned ja4
        run: |
          target/debug/wire-parity firefox tls.peet.ws 443 /api/all \
            --expect-ja4 t13d914h2_f91f431d341e_d7d6985f8b1b > /tmp/firefox.json
          grep -o '"ja4": *"t13d[^"]*' /tmp/firefox.json || true

      - name: brave must survive real parsing servers (2026-11-25 regression)
        run: |
          set -e
          target/debug/wire-parity brave example.com 443 / >/dev/null
          target/debug/wire-parity brave google.com 443 / >/dev/null

      - name: firefox must survive real parsing servers (2026-11-25 regression)
        run: |
          set -e
          target/debug/wire-parity firefox example.com 443 / >/dev/null
          target/debug/wire-parity firefox google.com 443 / >/dev/null
