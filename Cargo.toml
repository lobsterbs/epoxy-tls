[workspace]
resolver = "2"
members = [
	"server",
	"client",
	"wisp",
	"simple-wisp-client",
	"epoxy-hello",
	"wire-parity",
]
# the vendored rustls monorepo is its own cargo workspace; excluding it
# lets its crates inherit from vendor/rustls's own root manifest while
# the [patch.crates-io] entry below still unifies every consumer onto
# the patched copy.
exclude = ["vendor"]

[profile.release]
lto = true
debug = true
strip = false
panic = "abort"
codegen-units = 1
opt-level = 3

[patch.crates-io]
h2 = { git = "https://github.com/lobsterbs/h2-wasm" }
# lyrebird-patched rustls: apply patches/*.patch to vendor/rustls first
# (sh tools/apply-rustls.sh). Base 0.23.46, semver-compatible with the
# 0.23 lock; the patches add client hello profiles (browser_profiles).
rustls = { path = "vendor/rustls/rustls" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
missing_fields_in_debug = "allow"
case_sensitive_file_extension_comparisons = "allow"
